version: "3.8"

services:
  kabahome-bot:
    image: ghcr.io/kabaweb/kabahome-bot:latest
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - OMNIROUTE_URL=http://omniroute:20128/v1
      - OMNIROUTE_MODEL=high-availability
      - SSH_HOST=192.168.1.99
      - SSH_USER=root
      - SSH_PASSWORD=${SSH_PASSWORD}
      - PORTAINER_URL=http://192.168.1.99:9000
      - PORTAINER_USER=admin
      - PORTAINER_PASSWORD=${PORTAINER_PASSWORD}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - ALLOWED_USERS=${ALLOWED_USERS}
      - PORT=8080
    networks:
      - kabacorp_swarm
    deploy:
      replicas: 1
      restart_policy:
        condition: any

networks:
  kabacorp_swarm:
    external: true
